services:
  backend:
    image: hamzafareed123/syncboard-backend:latest
    build: ./backend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - MONGO_URL=${MONGO_URL}
      - SERVER_URL=${SERVER_URL:-http://localhost:5173}
      - CLIENT_URL=${CLIENT_URL:-http://localhost:5173}
      - REDIS_HOST=host.docker.internal
      - REDIS_PORT=6379
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    image: hamzafareed123/syncboard-frontend:latest
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:3000
    depends_on:
      - backend

